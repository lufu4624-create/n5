let mode="mixed", current=null, answered=false;
let data=JSON.parse(localStorage.getItem("n5stats")||'{"right":0,"total":0,"wrong":[]}');

function save(){localStorage.setItem("n5stats",JSON.stringify(data)); updateStats();}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newRound(m){mode=m; nextQ()}
function nextQ(){
 answered=false; document.getElementById("feedback").classList.add("hidden");
 let pool=mode==="word"?wordQs:mode==="grammar"?grammarQs:[...wordQs,...grammarQs];
 current=pool[Math.floor(Math.random()*pool.length)];
 document.getElementById("qtype").textContent=current.title?"🧩 语法题":"📚 单词题";
 document.getElementById("question").textContent=current.q;
 document.getElementById("reading").textContent="";
 let choices=shuffle(current.choices), box=document.getElementById("choices"); box.innerHTML="";
 choices.forEach(x=>{let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(x,b);box.appendChild(b)});
}
function answer(x,btn){
 if(answered)return; answered=true; data.total++;
 let ok=x===current.answer;
 if(ok){data.right++;btn.classList.add("correct")}else{
  btn.classList.add("wrong"); [...document.querySelectorAll(".choice")].forEach(b=>{if(b.textContent===current.answer)b.classList.add("correct")});
  data.wrong.unshift({q:current.q,answer:current.answer,explain:current.explain}); data.wrong=data.wrong.slice(0,100);
 }
 document.getElementById("feedback").className="feedback";
 document.getElementById("feedback").innerHTML=(ok?"✅ <b>正确！</b> ":"❌ <b>不对。</b> 正确答案：<b>"+current.answer+"</b> ") + current.explain;
 save();
}
function updateStats(){
 document.getElementById("score").textContent=data.right;document.getElementById("total").textContent=data.total;
 document.getElementById("rate").textContent=data.total?Math.round(data.right/data.total*100)+"%":"0%";
}
function show(id,btn){
 document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
 if(id==="words")renderWords();if(id==="grammar")renderGrammar();if(id==="wrong")renderWrong();if(id==="stats")renderStats();
}
function renderWords(){
 let s=(document.getElementById("search").value||"").toLowerCase(), box=document.getElementById("wordlist");box.innerHTML="";
 vocab.filter(w=>(w.jp+w.kanji+w.zh).toLowerCase().includes(s)).forEach(w=>{
  let d=document.createElement("div");d.className="card";d.style.boxShadow="none";d.style.border="1px solid #edf0f5";
  d.innerHTML="<b style='font-size:20px'>"+w.jp+"</b>　"+w.kanji+"<br><span class='small'>"+w.zh+"</span><br><button class='btn' style='margin-top:8px' onclick='startWord("+JSON.stringify(w.jp)+")'>刷这个</button>";
  box.appendChild(d);
 });
}
function startWord(jp){let w=vocab.find(x=>x.jp===jp);current={q:"「"+w.zh+"」对应哪个日语？",choices:shuffle([jp,...vocab.filter(x=>x.jp!==jp).slice(0,3).map(x=>x.jp)]),answer:jp,explain:jp+"（"+w.kanji+" / "+w.zh+"）。"};showQuiz();nextCustom()}
function showQuiz(){document.querySelector('nav button').click()}
function nextCustom(){answered=false;document.getElementById("feedback").classList.add("hidden");document.getElementById("qtype").textContent="📚 单词题";document.getElementById("question").textContent=current.q;let box=document.getElementById("choices");box.innerHTML="";shuffle(current.choices).forEach(x=>{let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(x,b);box.appendChild(b)})}
function renderGrammar(){let box=document.getElementById("grammarlist");box.innerHTML=grammarQs.map(g=>"<div class='card' style='box-shadow:none;border:1px solid #edf0f5'><span class='tag'>重点</span><h3>"+g.title+"</h3><p>"+g.q+"</p><p class='small'>答案："+g.answer+"　"+g.explain+"</p></div>").join("")}
function renderWrong(){let box=document.getElementById("wronglist");box.innerHTML=data.wrong.length?data.wrong.map((w,i)=>"<div class='card' style='box-shadow:none;border:1px solid #edf0f5'><b>"+(i+1)+". "+w.q+"</b><p>答案：<b>"+w.answer+"</b></p><p class='small'>"+w.explain+"</p></div>").join(""):"<p>🎉 暂时没有错题，继续刷！</p>"}
function clearWrong(){data.wrong=[];save();renderWrong()}
function renderStats(){let rate=data.total?Math.round(data.right/data.total*100):0;document.getElementById("statsDetail").innerHTML="<h3>累计答题："+data.total+" 题</h3><h3>答对："+data.right+" 题</h3><h3>正确率："+rate+"%</h3><p class='small'>所有记录只保存在你当前设备的浏览器里。</p>"}
